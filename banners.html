<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador Profissional Marbe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; display: flex; padding: 20px; gap: 20px; }
        .painel { width: 350px; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .area-canvas { flex-grow: 1; display: flex; justify-content: center; }
        button { width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; background: #0b1325; color: white; }
        input { width: 100%; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="painel">
    <h3>Configurações Iniciais</h3>
    <label>1. Subir Logo (Salvará na memória):</label>
    <input type="file" id="up-logo" onchange="salvarLogo(event)">
    
    <label>2. Subir Moldura (.PNG Transparente):</label>
    <input type="file" id="up-moldura" onchange="carregarMoldura(event)">

    <hr>
    <h3>Operação Diária</h3>
    <label>Foto do Produto:</label>
    <input type="file" onchange="adicionarFoto(event)">
    
    <button onclick="adicionarTexto('ROLOS EM PU', 100, 400)">+ Adicionar Título</button>
    <button onclick="baixarBanner()" style="background: #ff5722;">⬇️ BAIXAR BANNER FINAL</button>
</div>

<div class="area-canvas">
    <canvas id="canvas" width="540" height="960" style="border:1px solid #ccc"></canvas>
</div>

<script>
    const canvas = new fabric.Canvas('canvas');

    // 1. MEMÓRIA DA LOGO
    function salvarLogo(e) {
        const reader = new FileReader();
        reader.onload = (f) => localStorage.setItem('logo', f.target.result);
        reader.readAsDataURL(e.target.files[0]);
    }

    // 2. CARREGAR MOLDURA (A arte com curvas e faixas)
    function carregarMoldura(e) {
        const reader = new FileReader();
        reader.onload = (f) => {
            fabric.Image.fromURL(f.target.result, (img) => {
                img.set({ selectable: false, evented: false });
                canvas.add(img);
                img.sendToFront(); // Moldura sempre por cima
                adicionarLogoPadrao();
            });
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    function adicionarLogoPadrao() {
        const logo = localStorage.getItem('logo');
        if (logo) {
            fabric.Image.fromURL(logo, (img) => {
                img.scaleToWidth(120);
                img.set({ left: 30, top: 30 });
                canvas.add(img);
            });
        }
    }

    // 3. FOTO DO PRODUTO (Fica atrás da moldura)
    function adicionarFoto(e) {
        const reader = new FileReader();
        reader.onload = (f) => {
            fabric.Image.fromURL(f.target.result, (img) => {
                img.scaleToWidth(canvas.getWidth());
                canvas.add(img);
                img.sendToBack(); // Foto sempre no fundo
            });
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    // 4. TEXTOS
    function adicionarTexto(txt, left, top) {
        const text = new fabric.Textbox(txt, { left, top, fontSize: 40, fontWeight: '900', fill: '#0b1325' });
        canvas.add(text);
    }

    // 5. EXPORTAR
    function baixarBanner() {
        const link = document.createElement('a');
        link.download = 'banner-marbe.jpg';
        link.href = canvas.toDataURL({ format: 'jpeg', quality: 1.0, multiplier: 2 });
        link.click();
    }
</script>
</body>
</html>
