<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta CNPJ - React no HTML</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel para compilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.4s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans">

  <!-- A aplicação React será renderizada dentro desta div -->
  <div id="root"></div>

  <!-- Note o type="text/babel" para que o Babel processe o código -->
  <script type="text/babel">
    const { useState, useMemo } = React;

    // --- Utilitários de Formatação ---
    const formatCNPJ = (value) => {
      return value
        .replace(/\D/g, '')
        .replace(/^(\d{2})(\d)/, '$1.$2')
        .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
        .replace(/\.(\d{3})(\d)/, '.$1/$2')
        .replace(/(\d{4})(\d)/, '$1-$2')
        .substring(0, 18);
    };

    const formatCEP = (value) => {
      if (!value) return '';
      const cleanValue = String(value).replace(/\D/g, '');
      return cleanValue.replace(/^(\d{5})(\d)/, '$1-$2').substring(0, 9);
    };

    const formatCurrency = (value) => {
      if (isNaN(value) || value === null) return value;
      return new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL',
      }).format(value);
    };

    const formatDate = (value) => {
      if (!value) return '';
      const dateRegex = /^\d{4}-\d{2}-\d{2}/;
      if (dateRegex.test(value)) {
        const [year, month, day] = value.split('T')[0].split('-');
        return `${day}/${month}/${year}`;
      }
      return value;
    };

    const formatBoolean = (value) => (value ? 'Sim' : 'Não');

    // --- Componente de Ícones SVG Nativos ---
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        search: <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />,
        building: <path strokeLinecap="round" strokeLinejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008z" />,
        copy: <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" />,
        code: <path strokeLinecap="round" strokeLinejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5" />,
        check: <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" />,
        error: <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />,
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={className}>
          {icons[name]}
        </svg>
      );
    };

    // --- Componente Principal ---
    function ConsultaCNPJ() {
      const [cnpjInput, setCnpjInput] = useState('');
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [showRaw, setShowRaw] = useState(false);
      const [copied, setCopied] = useState(false);

      const handleInputChange = (e) => {
        setCnpjInput(formatCNPJ(e.target.value));
      };

      const buscarCNPJ = async (e) => {
        e.preventDefault();
        const cleanCnpj = cnpjInput.replace(/\D/g, '');
        
        if (cleanCnpj.length !== 14) {
          setError('CNPJ inválido. Digite 14 números.');
          return;
        }

        setLoading(true);
        setError('');
        setData(null);
        setShowRaw(false);

        try {
          const response = await fetch(`https://publica.cnpj.ws/cnpj/${cleanCnpj}`);
          const json = await response.json();
          
          if (!response.ok) {
            throw new Error(json.detalhes || 'Erro ao consultar CNPJ');
          }
          
          setData(json);
        } catch (err) {
          setError(err.message || 'Erro inesperado na consulta.');
        } finally {
          setLoading(false);
        }
      };

      const handleCopyJson = () => {
        if (data) {
          navigator.clipboard.writeText(JSON.stringify(data, null, 2));
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      const countFilledFields = (obj) => {
        let count = 0;
        if (obj !== null && typeof obj === 'object') {
          for (const key in obj) {
            count += countFilledFields(obj[key]);
          }
        } else if (obj !== null && obj !== '') {
          count += 1;
        }
        return count;
      };

      const totalFields = useMemo(() => (data ? countFilledFields(data) : 0), [data]);

      const renderDynamicData = (key, value, depth = 0) => {
        const isRoot = depth === 0;
        const paddingLeft = isRoot ? 'pl-0' : 'pl-4 border-l-2 border-gray-200 ml-2 mt-2';

        if (value === null || value === '') return null;

        if (Array.isArray(value)) {
          if (value.length === 0) return null;
          return (
            <div key={key} className={`mb-3 ${paddingLeft}`}>
              <span className="font-semibold text-gray-700 capitalize">{key.replace(/_/g, ' ')}:</span>
              <div className="mt-1 space-y-2">
                {value.map((item, index) => (
                  <div key={index} className="bg-gray-50 p-2 rounded border border-gray-100">
                    {renderDynamicData(`Item ${index + 1}`, item, depth + 1)}
                  </div>
                ))}
              </div>
            </div>
          );
        }

        if (typeof value === 'object') {
          return (
            <div key={key} className={`mb-3 ${paddingLeft}`}>
              {!isRoot && <span className="font-semibold text-indigo-700 capitalize block mb-1">{key.replace(/_/g, ' ')}</span>}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-2">
                {Object.entries(value).map(([subKey, subValue]) => 
                   renderDynamicData(subKey, subValue, depth + 1)
                )}
              </div>
            </div>
          );
        }

        let displayValue = value;
        if (typeof value === 'boolean') displayValue = formatBoolean(value);
        else if (key.toLowerCase().includes('cep')) displayValue = formatCEP(value);
        else if (key.toLowerCase().includes('data')) displayValue = formatDate(value);
        else if (key.toLowerCase().includes('capital_social')) displayValue = formatCurrency(value);
        else if (key.toLowerCase().includes('cnpj')) displayValue = formatCNPJ(String(value));

        return (
          <div key={key} className="text-sm py-1">
            <span className="font-medium text-gray-500 capitalize">{key.replace(/_/g, ' ')}:</span>{' '}
            <span className="text-gray-900 font-medium break-words">{String(displayValue)}</span>
          </div>
        );
      };

      return (
        <div className="min-h-screen p-4 sm:p-8">
          <div className="max-w-5xl mx-auto space-y-6">
            
            {/* Card de Busca */}
            <div className="bg-white rounded-xl shadow-sm p-6 sm:p-8 border border-gray-200">
              <div className="flex items-center gap-3 mb-6">
                <div className="p-3 bg-indigo-100 text-indigo-600 rounded-lg">
                  <Icon name="building" />
                </div>
                <div>
                  <h1 className="text-2xl font-bold text-gray-800">Consulta de CNPJ</h1>
                  <p className="text-gray-500 text-sm">Busca de dados em tempo real pela API Pública</p>
                </div>
              </div>

              <form onSubmit={buscarCNPJ} className="flex flex-col sm:flex-row gap-3">
                <div className="flex-grow">
                  <input
                    type="text"
                    value={cnpjInput}
                    onChange={handleInputChange}
                    placeholder="00.000.000/0001-00"
                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-lg tracking-wide"
                  />
                </div>
                <button
                  type="submit"
                  disabled={loading || cnpjInput.length < 18}
                  className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg flex items-center justify-center gap-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  {loading ? (
                    <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                  ) : (
                    <Icon name="search" />
                  )}
                  Consultar
                </button>
              </form>

              {error && (
                <div className="mt-4 p-4 bg-red-50 border border-red-200 text-red-600 rounded-lg flex items-center gap-2">
                  <Icon name="error" />
                  <span className="font-medium">{error}</span>
                </div>
              )}
            </div>

            {/* Resultados */}
            {data && (
              <div className="space-y-6 animate-fade-in-up">
                {/* Resumo */}
                <div className="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 pb-4 border-b border-gray-100 gap-4">
                    <h2 className="text-xl font-bold text-gray-800">Resumo da Empresa</h2>
                    <div className="flex items-center gap-2 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full text-sm font-medium">
                      <span>{totalFields} campos recuperados</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div>
                      <p className="text-sm text-gray-500">Razão Social</p>
                      <p className="font-bold text-gray-900">{data.razao_social || 'N/A'}</p>
                    </div>
                    <div>
                      <p className="text-sm text-gray-500">Nome Fantasia</p>
                      <p className="font-bold text-gray-900">{data.estabelecimento?.nome_fantasia || 'N/A'}</p>
                    </div>
                    <div>
                      <p className="text-sm text-gray-500">Situação Cadastral</p>
                      <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium mt-1
                        ${data.estabelecimento?.situacao_cadastral === 'Ativa' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                        {data.estabelecimento?.situacao_cadastral || 'N/A'}
                      </span>
                    </div>
                    <div className="lg:col-span-2">
                      <p className="text-sm text-gray-500">Endereço</p>
                      <p className="font-medium text-gray-900">
                        {data.estabelecimento?.tipo_logradouro} {data.estabelecimento?.logradouro}, {data.estabelecimento?.numero}
                        {data.estabelecimento?.complemento ? ` - ${data.estabelecimento.complemento}` : ''}
                      </p>
                    </div>
                    <div>
                      <p className="text-sm text-gray-500">Cidade / UF</p>
                      <p className="font-medium text-gray-900">
                        {data.estabelecimento?.cidade?.nome} / {data.estabelecimento?.estado?.sigla}
                      </p>
                    </div>
                    <div className="lg:col-span-3">
                      <p className="text-sm text-gray-500">Atividade Principal (CNAE)</p>
                      <p className="font-medium text-gray-900">
                        {data.estabelecimento?.atividade_principal?.classificacao} - {data.estabelecimento?.atividade_principal?.descricao}
                      </p>
                    </div>
                    <div>
                      <p className="text-sm text-gray-500">Contato</p>
                      <p className="font-medium text-gray-900">{data.estabelecimento?.telefone1 || 'N/A'}</p>
                    </div>
                    <div>
                      <p className="text-sm text-gray-500">E-mail</p>
                      <p className="font-medium text-gray-900 break-words">{data.estabelecimento?.email || 'N/A'}</p>
                    </div>
                    <div>
                      <p className="text-sm text-gray-500">Capital Social</p>
                      <p className="font-medium text-gray-900">{formatCurrency(data.capital_social)}</p>
                    </div>
                  </div>
                </div>

                {/* Ações */}
                <div className="flex gap-3">
                  <button
                    onClick={() => setShowRaw(!showRaw)}
                    className="flex items-center gap-2 px-4 py-2 bg-gray-800 hover:bg-gray-900 text-white rounded-lg text-sm font-medium transition-colors"
                  >
                    <Icon name="code" />
                    {showRaw ? 'Ocultar JSON' : 'Ver JSON Bruto'}
                  </button>
                  <button
                    onClick={handleCopyJson}
                    className="flex items-center gap-2 px-4 py-2 bg-white hover:bg-gray-50 text-gray-700 border border-gray-200 rounded-lg text-sm font-medium transition-colors shadow-sm"
                  >
                    <Icon name={copied ? 'check' : 'copy'} />
                    {copied ? 'Copiado!' : 'Copiar JSON'}
                  </button>
                </div>

                {/* JSON Bruto */}
                {showRaw && (
                  <div className="bg-gray-900 rounded-xl p-4 overflow-x-auto">
                    <pre className="text-green-400 text-sm font-mono leading-relaxed">
                      {JSON.stringify(data, null, 2)}
                    </pre>
                  </div>
                )}

                {/* Dinâmico */}
                <div className="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                  <h2 className="text-xl font-bold text-gray-800 mb-6 pb-4 border-b border-gray-100">
                    Todos os Dados Vinculados
                  </h2>
                  <div className="text-gray-700">
                    {renderDynamicData('Raiz', data)}
                  </div>
                </div>

              </div>
            )}
          </div>
        </div>
      );
    }

    // --- Renderização no DOM ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ConsultaCNPJ />);
  </script>
</body>
</html>
